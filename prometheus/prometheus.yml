global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: stockflow
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: stockflow-backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

